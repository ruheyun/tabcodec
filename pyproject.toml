[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'tabcodec'
version = '0.1.0'
requires-python = '>=3.9'
dependencies = [
    'numpy',
    'pandas',
    "scikit-learn>=1.6.1",
]

[tool.setuptools.packages.find]
where = ['src']

[tool.pytest.ini_options]
pythonpath = ["src"]

